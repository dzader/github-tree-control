name: Causal Loom v0.19 capture ENOLA metadata manifest

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.github/workflows/causal-loom-v019-capture-enola-metadata.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
          fetch-depth: 0
      - name: Wait for metadata parse and download artifact
        shell: bash
        run: |
          set -euo pipefail
          workflow='causal-loom-v019-enola-metadata-parse.yml'
          run_id=''
          for attempt in $(seq 1 100); do
            row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=causal-loom-v019-projective-atlas-enola-20260831&per_page=1" --jq '.workflow_runs[0] | [.id,.status,.conclusion] | @tsv')
            run_id=$(printf '%s' "$row" | cut -f1)
            status=$(printf '%s' "$row" | cut -f2)
            conclusion=$(printf '%s' "$row" | cut -f3)
            echo "metadata_run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then break; fi
            sleep 12
          done
          test -n "$run_id"
          test "$status" = completed
          test "$conclusion" = success
          rm -rf "$RUNNER_TEMP/download"; mkdir -p "$RUNNER_TEMP/download"
          gh run download "$run_id" -n causal-loom-v019-enola-documentation-metadata -D "$RUNNER_TEMP/download"
          test -f "$RUNNER_TEMP/download/metadata_summary.json"
          rm -rf .causal-loom-v019/enola_metadata
          mkdir -p .causal-loom-v019/enola_metadata
          cp "$RUNNER_TEMP/download/metadata_summary.json" .causal-loom-v019/enola_metadata/
          cp "$RUNNER_TEMP/download/ARCHIVE_SHA256.txt" .causal-loom-v019/enola_metadata/
          cp "$RUNNER_TEMP/download/MEASUREMENT_ACCESS_STATUS.txt" .causal-loom-v019/enola_metadata/
          printf '%s\n' "$run_id" > .causal-loom-v019/enola_metadata/GITHUB_RUN_ID.txt
          find .causal-loom-v019/enola_metadata -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > .causal-loom-v019/enola_metadata/SHA256SUMS.txt
      - name: Commit captured metadata evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Causal Loom Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .causal-loom-v019/enola_metadata
          if git diff --cached --quiet; then echo 'No metadata change'; exit 0; fi
          git commit -m 'Capture ENOLA metadata-only manifest before measurement access'
          git push origin HEAD:causal-loom-v019-projective-atlas-enola-20260831
