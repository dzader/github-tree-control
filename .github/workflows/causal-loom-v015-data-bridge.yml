name: Causal Loom v0.15 frozen UIUC multi-propeller bridge

on:
  push:
    branches:
      - causal-loom-v015-data-bridge-20260824

permissions:
  contents: read

jobs:
  package-public-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify frozen UIUC inputs
        run: |
          python causal_loom_v015/build_frozen_input_artifact.py \
            --work-dir "$RUNNER_TEMP/causal-loom-v015-work" \
            --output-dir "$RUNNER_TEMP/causal-loom-v015-artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v015-frozen-inputs
          path: ${{ runner.temp }}/causal-loom-v015-artifact
          if-no-files-found: error
          retention-days: 7
