name: Causal Loom v0.20 capture Lie atlas development evidence

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.github/workflows/causal-loom-v020-capture-lie-development.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
          fetch-depth: 0
      - name: Wait for Lie atlas development and download evidence
        shell: bash
        run: |
          set -euo pipefail
          workflow='causal-loom-v020-lie-five-probe-development.yml'
          for attempt in $(seq 1 180); do
            row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=causal-loom-v019-projective-atlas-enola-20260831&per_page=1" --jq '.workflow_runs[0] | [.id,.status,.conclusion] | @tsv')
            run_id=$(printf '%s' "$row"|cut -f1);status=$(printf '%s' "$row"|cut -f2);conclusion=$(printf '%s' "$row"|cut -f3)
            echo "lie_run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = completed ];then break;fi
            sleep 15
          done
          test "$status" = completed
          rm -rf "$RUNNER_TEMP/download";mkdir -p "$RUNNER_TEMP/download"
          gh run download "$run_id" -n causal-loom-v020-lie-five-probe-development -D "$RUNNER_TEMP/download"
          test -f "$RUNNER_TEMP/download/development_summary.json"
          rm -rf .causal-loom-v020/lie_development_result;mkdir -p .causal-loom-v020/lie_development_result
          cp "$RUNNER_TEMP/download/development_summary.json" .causal-loom-v020/lie_development_result/
          cp "$RUNNER_TEMP/download/per_family.csv" .causal-loom-v020/lie_development_result/
          cp "$RUNNER_TEMP/download/stdout.log" .causal-loom-v020/lie_development_result/
          cp "$RUNNER_TEMP/download/EXECUTION_EXIT_STATUS.txt" .causal-loom-v020/lie_development_result/
          printf '%s\n' "$run_id" > .causal-loom-v020/lie_development_result/GITHUB_RUN_ID.txt
          printf '%s\n' "$conclusion" > .causal-loom-v020/lie_development_result/GITHUB_WORKFLOW_CONCLUSION.txt
          find .causal-loom-v020/lie_development_result -type f ! -name SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > .causal-loom-v020/lie_development_result/SHA256SUMS.txt
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name 'Causal Loom Evidence Bot';git config user.email 'actions@users.noreply.github.com'
          git add .causal-loom-v020/lie_development_result
          if ! git diff --cached --quiet;then git commit -m 'Capture v0.20 Projective Lie Transport Atlas evidence';git push origin HEAD:causal-loom-v019-projective-atlas-enola-20260831;fi
