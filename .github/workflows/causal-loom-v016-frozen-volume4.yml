name: Causal Loom v0.16 frozen UIUC Volume 4 confirmation

on:
  push:
    branches:
      - causal-loom-v016-adaptive-gauge-20260826
    paths:
      - '.causal-loom-v016/**'
      - '.github/workflows/causal-loom-v016-frozen-volume4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PROTOCOL_SHA256: d5acb6ce6a5f7860df19fecb2d9f4b096c061229dc8c76c1c986a256569cdf78
  DEVELOPMENT_SHA256: c80f44230df74dbc747165724cde82bbc14e70352a699008138efd01ae35e1aa
  RUNNER_SHA256: 713569f85e3fbc070366047b6cc333b63ab14cbb9e0399c7c0383fa99e1e0d59
  RUNNER_PAYLOAD_SHA256: 1d72c60872f3b016fb125b1227a8e288bfa4891533fef5ce049f00d105c1f249
  INVENTORY_SHA256: 72b3f2e2f6dc7509cc99f9cdf596d1a3a7566b95b60cfbabca9684fc85be6415

jobs:
  frozen-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out frozen experiment branch
        uses: actions/checkout@v4
        with:
          ref: causal-loom-v016-adaptive-gauge-20260826

      - name: Verify frozen scientific files before holdout measurement access
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .causal-loom-v016/V016_FROZEN_PROTOCOL.json | cut -d' ' -f1)" = "$PROTOCOL_SHA256"
          test "$(sha256sum .causal-loom-v016/V016_DEVELOPMENT_EVIDENCE.json | cut -d' ' -f1)" = "$DEVELOPMENT_SHA256"
          test "$(sha256sum .causal-loom-v016/run_v016_frozen.py.gz.b64 | cut -d' ' -f1)" = "$RUNNER_PAYLOAD_SHA256"
          base64 --decode .causal-loom-v016/run_v016_frozen.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/run_v016_frozen.py"
          test "$(sha256sum "$RUNNER_TEMP/run_v016_frozen.py" | cut -d' ' -f1)" = "$RUNNER_SHA256"
          python -m py_compile "$RUNNER_TEMP/run_v016_frozen.py"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic numerical dependency
        run: pip install numpy==2.1.3

      - name: Run frozen executable self-test before measurement access
        run: python "$RUNNER_TEMP/run_v016_frozen.py" --self-test

      - name: Reconstruct and verify frozen metadata-only holdout inventory
        shell: bash
        run: |
          set -euo pipefail
          INDEX='https://m-selig.ae.illinois.edu/props/volume-4/propDB-volume-4.html'
          curl --fail --silent --show-error -L "$INDEX" -o "$RUNNER_TEMP/index.html"
          export OUT="$RUNNER_TEMP/inventory.json"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          from urllib.parse import urljoin
          html=(Path(os.environ['RUNNER_TEMP'])/'index.html').read_text(errors='replace')
          if hashlib.sha256(html.encode()).hexdigest()!='11899f61683ac6422605c359f6dd7ea5aa89bca8dc86ab3eb0db3df3ce09bea0':
              raise RuntimeError('source index changed')
          hrefs=re.findall(r'href=["\']([^"\']+\.txt)["\']',html,re.I)
          pat=re.compile(r'^(?:\.\./)?(?:data/)?(?P<name>apce_(?P<D>\d+(?:\.\d+)?)x(?P<P>\d+(?:\.\d+)?)_(?P<prov>[^_/]+)_(?P<rpm>\d{3,5})\.txt)$',re.I)
          by={};base='https://m-selig.ae.illinois.edu/props/volume-4/'
          for href in hrefs:
              clean=href.lstrip('./');m=pat.match(clean)
              if not m: continue
              family=f"apce_{m.group('D')}x{m.group('P')}"
              if family.lower()=='apce_12x6': continue
              row={'href':href,'url':urljoin(base,href),'filename':m.group('name'),'family':family,'diameter_in':float(m.group('D')),'pitch_in':float(m.group('P')),'provenance_token':m.group('prov'),'rpm':int(m.group('rpm'))}
              by.setdefault(family,[]).append(row)
          families=[]
          for fam,rows in sorted(by.items()):
              seen=set();uniq=[]
              for r in sorted(rows,key=lambda x:(x['rpm'],x['url'])):
                  if r['url'] in seen: continue
                  seen.add(r['url']);uniq.append(r)
              families.append({'family':fam,'diameter_in':uniq[0]['diameter_in'],'pitch_in':uniq[0]['pitch_in'],'run_count':len(uniq),'runs':uniq})
          payload={'source_index':base+'propDB-volume-4.html','index_sha256':hashlib.sha256(html.encode()).hexdigest(),'contents_read':False,'excluded_families':['apce_12x6'],'family_count':len(families),'families':families}
          text=json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n';Path(os.environ['OUT']).write_text(text)
          print('INVENTORY_RECONSTRUCTED',hashlib.sha256(text.encode()).hexdigest(),len(families),sum(f['run_count'] for f in families))
          PY
          test "$(sha256sum "$RUNNER_TEMP/inventory.json" | cut -d' ' -f1)" = "$INVENTORY_SHA256"

      - name: Retrieve first-use frozen holdout measurement files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v4data"
          export INV="$RUNNER_TEMP/inventory.json"
          python - <<'PY' > "$RUNNER_TEMP/download.tsv"
          import json,os
          x=json.load(open(os.environ['INV']))
          for f in x['families']:
              for r in f['runs']:
                  print(r['url']+'\t'+r['filename'])
          PY
          export DATADIR="$RUNNER_TEMP/v4data"
          cat "$RUNNER_TEMP/download.tsv" | xargs -P 8 -d '\n' -I{} bash -c '
            line="$1"; url="${line%%$'"'"'\t'"'"'*}"; name="${line#*$'"'"'\t'"'"'}";
            curl --fail --silent --show-error -L --retry 3 "$url" -o "$DATADIR/$name";
            test -s "$DATADIR/$name"
          ' _ {}
          test "$(find "$RUNNER_TEMP/v4data" -type f | wc -l)" -eq 121
          echo HOLDOUT_MEASUREMENTS_RETRIEVED_121

      - name: Execute first and permanent v0.16 holdout evaluation
        id: scientific
        shell: bash
        run: |
          set +e
          rm -rf causal-loom-v016-frozen-output
          python "$RUNNER_TEMP/run_v016_frozen.py" \
            --protocol .causal-loom-v016/V016_FROZEN_PROTOCOL.json \
            --inventory "$RUNNER_TEMP/inventory.json" \
            --data-dir "$RUNNER_TEMP/v4data" \
            --output-dir causal-loom-v016-frozen-output \
            > "$RUNNER_TEMP/v016_stdout.log" 2>&1
          status=$?
          set -e
          mkdir -p causal-loom-v016-frozen-output
          cp "$RUNNER_TEMP/v016_stdout.log" causal-loom-v016-frozen-output/stdout.log
          cat "$RUNNER_TEMP/v016_stdout.log"
          echo "$status" > causal-loom-v016-frozen-output/EXECUTION_EXIT_STATUS.txt
          cp .causal-loom-v016/V016_FROZEN_PROTOCOL.json causal-loom-v016-frozen-output/
          cp .causal-loom-v016/V016_DEVELOPMENT_EVIDENCE.json causal-loom-v016-frozen-output/
          cp "$RUNNER_TEMP/run_v016_frozen.py" causal-loom-v016-frozen-output/
          cp "$RUNNER_TEMP/inventory.json" causal-loom-v016-frozen-output/holdout_inventory.json
          printf 'python=' > causal-loom-v016-frozen-output/RUNTIME_ENVIRONMENT.txt
          python --version >> causal-loom-v016-frozen-output/RUNTIME_ENVIRONMENT.txt 2>&1
          python -c 'import numpy; print("numpy="+numpy.__version__)' >> causal-loom-v016-frozen-output/RUNTIME_ENVIRONMENT.txt
          find causal-loom-v016-frozen-output -type f ! -name FILES_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > causal-loom-v016-frozen-output/FILES_SHA256SUMS.txt
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload immutable v0.16 frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v016-uiuc-v4-frozen-evidence
          path: causal-loom-v016-frozen-output
          if-no-files-found: error
          retention-days: 90

      - name: Preserve frozen scientific verdict as workflow conclusion
        if: always()
        shell: bash
        run: |
          status='${{ steps.scientific.outputs.exit_status }}'
          test -n "$status"
          exit "$status"
