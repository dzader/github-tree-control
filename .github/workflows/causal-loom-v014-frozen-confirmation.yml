name: Causal Loom v0.14 frozen dynamic propeller confirmation

on:
  push:
    branches:
      - causal-loom-v014-dynamic-propeller-20260825
    paths:
      - '.github/workflows/causal-loom-v014-frozen-confirmation.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  UIUC_COMMIT: e95db20206f7e89fe6d639ce030e887ec2ce7277
  PROTOCOL_SHA256: 8d74e03296bd0b533eef8ef00d5aca01f05f0127aaf0857fb145be9d19299db8
  RUNNER_SHA256: bffa4801d30f2a2090df82cad3a05db5510091d3e240d30d94937b8a02a33024
  MANIFEST_SHA256: 6d974638ddd81c8a3e950f0eed754a66a2963d2dac7be7a1fdbbef64ba8702c4

jobs:
  frozen-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen experiment commit
        uses: actions/checkout@v4
        with:
          ref: causal-loom-v014-dynamic-propeller-20260825

      - name: Restore and verify frozen executable before holdout access
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .causal-loom-v014/V014_FROZEN_PROTOCOL.json | cut -d' ' -f1)" = "$PROTOCOL_SHA256"
          base64 --decode .causal-loom-v014/run_v014_frozen.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/run_v014_frozen.py"
          test "$(sha256sum "$RUNNER_TEMP/run_v014_frozen.py" | cut -d' ' -f1)" = "$RUNNER_SHA256"
          python -m py_compile "$RUNNER_TEMP/run_v014_frozen.py"

      - name: Set up deterministic numerical runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependency
        run: pip install numpy==2.1.3

      - name: Run executable self-test before holdout access
        run: python "$RUNNER_TEMP/run_v014_frozen.py" --self-test

      - name: Reconstruct and verify metadata-only frozen holdout manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -L -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/pfreitas97/Parser_UIUC_AeroData/git/trees/'"$UIUC_COMMIT"'?recursive=1' \
            > "$RUNNER_TEMP/tree.json"
          python - <<'PY'
          import hashlib,json,re,os
          from pathlib import Path
          protocol=json.loads(Path('.causal-loom-v014/V014_FROZEN_PROTOCOL.json').read_text())
          tree=json.loads((Path(os.environ['RUNNER_TEMP'])/'tree.json').read_text())
          if tree.get('truncated'): raise RuntimeError('source tree truncated')
          wanted=set(protocol['holdout']['family_names'])
          pat=re.compile(r'^(?P<prefix>.+)_(?P<rpm>\d{3,5})\.txt$')
          dim=re.compile(r'_(?P<D>\d+(?:\.\d+)?)x(?P<P>\d+(?:\.\d+)?)')
          by={}
          for e in tree['tree']:
            path=e.get('path','')
            if e.get('type')!='blob' or not path.startswith(('Propeller_Data_V1/','Propeller_Data_V2/')) or not path.endswith('.txt') or '_static_' in path: continue
            m=pat.match(Path(path).name)
            if not m: continue
            parts=m.group('prefix').split('_')
            if len(parts)<3: continue
            family='_'.join(parts[:-1])
            if family not in wanted: continue
            rank=hashlib.sha256((path+'\0'+e['sha']).encode()).hexdigest()
            by.setdefault(family,[]).append({'path':path,'blob_sha':e['sha'],'rpm':int(m.group('rpm')),'rank':rank})
          families=[]
          for family in protocol['holdout']['family_names']:
            rows=by.get(family,[]); by_rpm={}
            for r in rows: by_rpm.setdefault(r['rpm'],[]).append(r)
            uniq=[]
            for rpm,rs in by_rpm.items(): uniq.append(sorted(rs,key=lambda r:r['rank'])[0])
            uniq=sorted(uniq,key=lambda r:(r['rpm'],r['path']))
            if len(uniq)<4: raise RuntimeError(f'insufficient metadata runs for {family}')
            cal=uniq[(len(uniq)-1)//2]
            dm=dim.search(family)
            if not dm: raise RuntimeError(f'cannot parse dimensions for {family}')
            def mini(r): return {'path':r['path'],'blob_sha':r['blob_sha'],'rpm':r['rpm']}
            families.append({'family':family,'diameter_in':float(dm.group('D')),'pitch_in':float(dm.group('P')),
              'calibration_run':mini(cal),'confirmatory_runs':[mini(r) for r in uniq if r is not cal]})
          text=json.dumps({'families':families},sort_keys=True,separators=(',',':'))+'\n'
          out=Path(os.environ['RUNNER_TEMP'])/'holdout_manifest.json'; out.write_text(text)
          actual=hashlib.sha256(text.encode()).hexdigest()
          expected=protocol['holdout']['canonical_manifest_sha256']
          if actual!=expected: raise RuntimeError(f'manifest hash mismatch {actual} != {expected}')
          print(f'MANIFEST_VERIFIED {actual} families={len(families)}')
          PY
          test "$(sha256sum "$RUNNER_TEMP/holdout_manifest.json" | cut -d' ' -f1)" = "$MANIFEST_SHA256"

      - name: Retrieve only frozen holdout files and verify Git blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uiuc_holdout"
          python - <<'PY' > "$RUNNER_TEMP/download.tsv"
          import json,os
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'holdout_manifest.json')))
          for f in x['families']:
            for r in [f['calibration_run'],*f['confirmatory_runs']]:
              print(f"{r['blob_sha']}\t{r['path']}")
          PY
          export OUT="$RUNNER_TEMP/uiuc_holdout" COMMIT="$UIUC_COMMIT"
          cat "$RUNNER_TEMP/download.tsv" | xargs -P 24 -d '\n' -I{} bash -c '
            line="$1"; sha="${line%%$'"'"'\t'"'"'*}"; path="${line#*$'"'"'\t'"'"'}"; target="$OUT/$path"; mkdir -p "$(dirname "$target")";
            curl --fail --silent --show-error -L "https://raw.githubusercontent.com/pfreitas97/Parser_UIUC_AeroData/$COMMIT/$path" -o "$target";
            actual=$(git hash-object "$target"); test "$actual" = "$sha"
          ' _ {}
          echo "HOLDOUT_BLOBS_VERIFIED $(wc -l < "$RUNNER_TEMP/download.tsv")"

      - name: Execute first frozen holdout evaluation
        id: execute
        shell: bash
        run: |
          set +e
          mkdir -p causal-loom-v014-frozen-output
          python "$RUNNER_TEMP/run_v014_frozen.py" \
            --protocol .causal-loom-v014/V014_FROZEN_PROTOCOL.json \
            --manifest "$RUNNER_TEMP/holdout_manifest.json" \
            --data-dir "$RUNNER_TEMP/uiuc_holdout" \
            --output-dir causal-loom-v014-frozen-output \
            2>&1 | tee causal-loom-v014-frozen-output/stdout.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > causal-loom-v014-frozen-output/EXECUTION_EXIT_STATUS.txt
          cp .causal-loom-v014/V014_FROZEN_PROTOCOL.json causal-loom-v014-frozen-output/
          cp "$RUNNER_TEMP/run_v014_frozen.py" causal-loom-v014-frozen-output/
          cp "$RUNNER_TEMP/holdout_manifest.json" causal-loom-v014-frozen-output/
          printf 'python=' > causal-loom-v014-frozen-output/RUNTIME_ENVIRONMENT.txt
          python --version >> causal-loom-v014-frozen-output/RUNTIME_ENVIRONMENT.txt 2>&1
          python -c 'import numpy; print("numpy="+numpy.__version__)' >> causal-loom-v014-frozen-output/RUNTIME_ENVIRONMENT.txt
          find causal-loom-v014-frozen-output -type f ! -name FILES_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > causal-loom-v014-frozen-output/FILES_SHA256SUMS.txt
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload immutable frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v014-dynamic-uiuc-frozen-evidence
          path: causal-loom-v014-frozen-output
          if-no-files-found: error
          retention-days: 90

      - name: Preserve frozen verdict as workflow conclusion
        if: always()
        shell: bash
        run: |
          status='${{ steps.execute.outputs.exit_status }}'
          test -n "$status"
          exit "$status"
