name: Causal Loom v0.21 sealed cross-domain atlas development

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.causal-loom-v021/development_schema/DEVELOPMENT_SCHEMA.json'
      - '.causal-loom-v021/develop_cross_domain_projective_response_atlas.py'
      - '.github/workflows/causal-loom-v021-cross-domain-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sealed premeasurement protocol
        shell: bash
        run: |
          set -euo pipefail
          test -f .causal-loom-v021/premeasurement_protocol/PREMEASUREMENT_PROTOCOL.json
          test -f .causal-loom-v021/development_schema/CONFIRMATION_ACCESS_STATUS.txt
          grep -qi '^False' .causal-loom-v021/development_schema/CONFIRMATION_ACCESS_STATUS.txt
          status=$(python -c 'import json;print(json.load(open(".causal-loom-v021/premeasurement_protocol/PREMEASUREMENT_PROTOCOL.json"))["status"])')
          test "$status" = ready_for_development_access
      - name: Install deterministic numerical dependencies
        run: pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 openpyxl==3.1.5 h5py==3.12.1 pyarrow==17.0.0
      - name: Retrieve development and validation files only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cross-domain"; mkdir -p "$RUNNER_TEMP/cross-domain/downloads" "$RUNNER_TEMP/cross-domain/extracted"
          export ROOT="$RUNNER_TEMP/cross-domain"
          python - <<'PY'
          import json,os,urllib.request,zipfile
          from pathlib import Path
          protocol=json.load(open('.causal-loom-v021/premeasurement_protocol/PREMEASUREMENT_PROTOCOL.json'))
          metadata=json.load(open('.causal-loom-v021/selected_holdout_metadata/METADATA_MANIFEST.json'))
          root=Path(os.environ['ROOT']);downloads=root/'downloads';extracted=root/'extracted'
          allowed=[];forbidden=[]
          for family in protocol['families']:
              target=allowed if family['split'] in ('development','validation') else forbidden
              for row in family['files']:target.append({'family_key':family['family_key'],'split':family['split'],**row})
          (root/'confirmation_forbidden.json').write_text(json.dumps(forbidden,indent=2,sort_keys=True)+'\n')
          top={f['key']:f for f in metadata['files']};downloaded={};manifest=[]
          for row in allowed:
              container=row.get('container')
              if container:
                  source=top.get(container)
                  if not source:raise RuntimeError(f'archive not found: {container}')
                  if container not in downloaded:
                      target=downloads/Path(container).name;urllib.request.urlretrieve(source['url'],target);downloaded[container]=target
                  with zipfile.ZipFile(downloaded[container]) as archive:
                      if row['path'] not in archive.namelist():raise RuntimeError(f'missing member {row["path"]}')
                      out=extracted/row['family_key'].replace(':','__')/Path(row['path']).name;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(archive.read(row['path']))
              else:
                  source=top.get(row['path'])
                  if not source:raise RuntimeError(f'top-level file not found: {row["path"]}')
                  out=extracted/row['family_key'].replace(':','__')/Path(row['path']).name;out.parent.mkdir(parents=True,exist_ok=True);urllib.request.urlretrieve(source['url'],out)
              manifest.append({'family_key':row['family_key'],'split':row['split'],'source_path':row['path'],'local_relative_path':str(out.relative_to(extracted)),'bytes':out.stat().st_size})
          (root/'development_extraction_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('EXTRACTED_DEV_VALIDATION',len(manifest),'SEALED_CONFIRMATION_FILES',len(forbidden))
          PY
      - name: Execute cross-domain family-disjoint development
        id: evaluate
        shell: bash
        run: |
          set +e
          rm -rf causal-loom-v021-cross-domain-development
          python .causal-loom-v021/develop_cross_domain_projective_response_atlas.py \
            --protocol .causal-loom-v021/premeasurement_protocol/PREMEASUREMENT_PROTOCOL.json \
            --extraction-manifest "$RUNNER_TEMP/cross-domain/development_extraction_manifest.json" \
            --data-root "$RUNNER_TEMP/cross-domain/extracted" \
            --output-dir causal-loom-v021-cross-domain-development \
            > "$RUNNER_TEMP/v021-development.log" 2>&1
          status=$?
          set -e
          mkdir -p causal-loom-v021-cross-domain-development
          cp "$RUNNER_TEMP/v021-development.log" causal-loom-v021-cross-domain-development/stdout.log
          cp "$RUNNER_TEMP/cross-domain/development_extraction_manifest.json" causal-loom-v021-cross-domain-development/
          cp "$RUNNER_TEMP/cross-domain/confirmation_forbidden.json" causal-loom-v021-cross-domain-development/
          cat "$RUNNER_TEMP/v021-development.log"
          echo "$status" > causal-loom-v021-cross-domain-development/EXECUTION_EXIT_STATUS.txt
          printf 'False — confirmation-family files were not extracted.\n' > causal-loom-v021-cross-domain-development/CONFIRMATION_ACCESS_STATUS.txt
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v021-cross-domain-development
          path: causal-loom-v021-cross-domain-development
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Preserve development verdict
        shell: bash
        run: exit '${{ steps.evaluate.outputs.exit_status }}'
