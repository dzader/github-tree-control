name: Causal Loom v0.21 capture cross-domain development evidence

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.github/workflows/causal-loom-v021-capture-cross-domain-development.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: causal-loom-v021-capture-cross-domain-development
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
          fetch-depth: 0
      - name: Wait for development run and download evidence
        shell: bash
        run: |
          set -euo pipefail
          workflow='causal-loom-v021-cross-domain-development.yml'
          for attempt in $(seq 1 240); do
            row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=causal-loom-v019-projective-atlas-enola-20260831&per_page=1" --jq '.workflow_runs[0] | [.id,.status,.conclusion] | @tsv')
            run_id=$(printf '%s' "$row"|cut -f1);status=$(printf '%s' "$row"|cut -f2);conclusion=$(printf '%s' "$row"|cut -f3)
            echo "v021_development_run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = completed ];then break;fi
            sleep 15
          done
          test "$status" = completed
          rm -rf "$RUNNER_TEMP/download";mkdir -p "$RUNNER_TEMP/download"
          gh run download "$run_id" -n causal-loom-v021-cross-domain-development -D "$RUNNER_TEMP/download"
          test -f "$RUNNER_TEMP/download/development_summary.json"
          rm -rf .causal-loom-v021/development_result;mkdir -p .causal-loom-v021/development_result
          cp -a "$RUNNER_TEMP/download/." .causal-loom-v021/development_result/
          printf '%s\n' "$run_id" > .causal-loom-v021/development_result/GITHUB_RUN_ID.txt
          printf '%s\n' "$conclusion" > .causal-loom-v021/development_result/GITHUB_WORKFLOW_CONCLUSION.txt
          find .causal-loom-v021/development_result -type f ! -name CAPTURED_SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > .causal-loom-v021/development_result/CAPTURED_SHA256SUMS.txt
      - name: Commit development evidence with push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Causal Loom Evidence Bot';git config user.email 'actions@users.noreply.github.com'
          git add .causal-loom-v021/development_result
          if git diff --cached --quiet;then echo 'No evidence change';exit 0;fi
          git commit -m 'Capture sealed cross-domain Projective Response Atlas development evidence'
          for attempt in 1 2 3 4 5;do
            if git push origin HEAD:causal-loom-v019-projective-atlas-enola-20260831;then exit 0;fi
            git pull --rebase origin causal-loom-v019-projective-atlas-enola-20260831;sleep $((attempt*2))
          done
          exit 1
