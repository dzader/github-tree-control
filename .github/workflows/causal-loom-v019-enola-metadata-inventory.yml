name: Causal Loom v0.19 ENOLA metadata-only inventory

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.github/workflows/causal-loom-v019-enola-metadata-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
      - name: Download immutable ENOLA v1 archive and expose metadata only
        shell: bash
        env:
          ENOLA_URL: https://zenodo.org/records/20111572/files/Propeller_Database.zip?download=1
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/causal-loom-v019-enola-metadata"
          mkdir -p "$OUT/readmes"
          curl --fail --silent --show-error -L --retry 4 "$ENOLA_URL" -o "$RUNNER_TEMP/Propeller_Database.zip"
          sha256sum "$RUNNER_TEMP/Propeller_Database.zip" > "$OUT/ARCHIVE_SHA256.txt"
          stat --printf='%s\n' "$RUNNER_TEMP/Propeller_Database.zip" > "$OUT/ARCHIVE_BYTES.txt"
          unzip -Z1 "$RUNNER_TEMP/Propeller_Database.zip" | LC_ALL=C sort > "$OUT/ARCHIVE_PATHS.txt"
          unzip -l "$RUNNER_TEMP/Propeller_Database.zip" > "$OUT/ARCHIVE_LISTING.txt"
          # Only documentation and general inventory are extracted. No result table is opened.
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          zpath=Path(os.environ['RUNNER_TEMP'])/'Propeller_Database.zip'
          out=Path(os.environ['RUNNER_TEMP'])/'causal-loom-v019-enola-metadata'
          selected=[]
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              for name in names:
                  base=Path(name).name.lower()
                  if base.startswith('readme') and not name.endswith('/'):
                      data=z.read(name)
                      target=out/'readmes'/('__'.join(Path(name).parts))
                      target.write_bytes(data)
                      selected.append({'archive_path':name,'bytes':len(data),'extracted_to':str(target.relative_to(out))})
                  elif base in {'generalinfo.xlsx','general_info.xlsx'}:
                      data=z.read(name)
                      target=out/Path(name).name
                      target.write_bytes(data)
                      selected.append({'archive_path':name,'bytes':len(data),'extracted_to':target.name})
          (out/'EXTRACTED_METADATA_MANIFEST.json').write_text(json.dumps(selected,indent=2,sort_keys=True)+'\n')
          print('ARCHIVE_PATHS',len(names),'METADATA_FILES',len(selected))
          PY
          echo 'No numeric result file was extracted or parsed in this inventory.' > "$OUT/MEASUREMENT_ACCESS_STATUS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v019-enola-metadata-only
          path: ${{ runner.temp }}/causal-loom-v019-enola-metadata
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
