name: Causal Loom v0.19 capture five-probe development result

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.github/workflows/causal-loom-v019-capture-development-result.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
          fetch-depth: 0
      - name: Wait for latest five-probe development run and download evidence
        shell: bash
        run: |
          set -euo pipefail
          workflow='causal-loom-v019-five-probe-development.yml'
          run_id=''
          for attempt in $(seq 1 120); do
            row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=causal-loom-v019-projective-atlas-enola-20260831&per_page=1" --jq '.workflow_runs[0] | [.id,.status,.conclusion] | @tsv')
            run_id=$(printf '%s' "$row" | cut -f1)
            status=$(printf '%s' "$row" | cut -f2)
            conclusion=$(printf '%s' "$row" | cut -f3)
            echo "development_run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then break; fi
            sleep 15
          done
          test -n "$run_id"
          test "$status" = completed
          rm -rf "$RUNNER_TEMP/download"; mkdir -p "$RUNNER_TEMP/download"
          gh run download "$run_id" -n causal-loom-v019-five-probe-development -D "$RUNNER_TEMP/download"
          test -f "$RUNNER_TEMP/download/development_summary.json"
          rm -rf .causal-loom-v019/development_result
          mkdir -p .causal-loom-v019/development_result
          cp "$RUNNER_TEMP/download/development_summary.json" .causal-loom-v019/development_result/
          cp "$RUNNER_TEMP/download/per_family.csv" .causal-loom-v019/development_result/
          cp "$RUNNER_TEMP/download/stdout.log" .causal-loom-v019/development_result/
          cp "$RUNNER_TEMP/download/EXECUTION_EXIT_STATUS.txt" .causal-loom-v019/development_result/
          printf '%s\n' "$run_id" > .causal-loom-v019/development_result/GITHUB_RUN_ID.txt
          find .causal-loom-v019/development_result -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > .causal-loom-v019/development_result/SHA256SUMS.txt
      - name: Commit captured evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Causal Loom Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .causal-loom-v019/development_result
          if git diff --cached --quiet; then echo 'No evidence change'; exit 0; fi
          git commit -m 'Capture v0.19 exact five-probe development evidence'
          git push origin HEAD:causal-loom-v019-projective-atlas-enola-20260831
