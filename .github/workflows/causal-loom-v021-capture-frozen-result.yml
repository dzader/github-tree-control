name: Causal Loom v0.21 capture frozen cross-domain result

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.causal-loom-v021/frozen/**'
      - '.github/workflows/causal-loom-v021-capture-frozen-result.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: causal-loom-v021-capture-frozen-result
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
          fetch-depth: 0
      - name: Wait for frozen confirmation and download evidence
        shell: bash
        run: |
          set -euo pipefail
          workflow='causal-loom-v021-frozen-confirmation.yml'
          for attempt in $(seq 1 240);do
            row=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=causal-loom-v019-projective-atlas-enola-20260831&per_page=1" --jq '.workflow_runs[0] | [.id,.status,.conclusion] | @tsv')
            run_id=$(printf '%s' "$row"|cut -f1);status=$(printf '%s' "$row"|cut -f2);conclusion=$(printf '%s' "$row"|cut -f3)
            echo "v021_frozen_run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = completed ];then break;fi
            sleep 15
          done
          test "$status" = completed
          rm -rf "$RUNNER_TEMP/download";mkdir -p "$RUNNER_TEMP/download"
          gh run download "$run_id" -n causal-loom-v021-cross-domain-frozen-evidence -D "$RUNNER_TEMP/download"
          test -f "$RUNNER_TEMP/download/results.json"
          rm -rf .causal-loom-v021/frozen_result;mkdir -p .causal-loom-v021/frozen_result
          cp -a "$RUNNER_TEMP/download/." .causal-loom-v021/frozen_result/
          printf '%s\n' "$run_id" > .causal-loom-v021/frozen_result/GITHUB_RUN_ID.txt
          printf '%s\n' "$conclusion" > .causal-loom-v021/frozen_result/GITHUB_WORKFLOW_CONCLUSION.txt
          find .causal-loom-v021/frozen_result -type f ! -name CAPTURED_SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > .causal-loom-v021/frozen_result/CAPTURED_SHA256SUMS.txt
      - name: Commit frozen confirmation evidence with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Causal Loom Evidence Bot';git config user.email 'actions@users.noreply.github.com'
          git add .causal-loom-v021/frozen_result
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'Capture immutable v0.21 cross-domain frozen result'
          for attempt in 1 2 3 4 5;do
            if git push origin HEAD:causal-loom-v019-projective-atlas-enola-20260831;then exit 0;fi
            git pull --rebase origin causal-loom-v019-projective-atlas-enola-20260831;sleep $((attempt*2))
          done
          exit 1
