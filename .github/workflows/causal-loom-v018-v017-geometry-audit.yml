name: Causal Loom v0.18 post-failure v0.17 geometry audit

on:
  push:
    branches:
      - causal-loom-v017-coordinate-field-20260831
    paths:
      - '.github/workflows/causal-loom-v018-v017-geometry-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  V3_INDEX: https://m-selig.ae.illinois.edu/props/volume-3/propDB-volume-3.html
  V017_RUNNER_SHA256: ea78369d6d34bd34fbb11caaecc526c8903113ca060b118dff2a9dfc2e7e2d85
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v017-coordinate-field-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3
      - name: Restore exact v0.17 frozen runner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode --ignore-garbage .causal-loom-v017/run_v017_frozen.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/v017.py"
          test "$(sha256sum "$RUNNER_TEMP/v017.py" | cut -d' ' -f1)" = "$V017_RUNNER_SHA256"
      - name: Reconstruct consumed Volume-3 inventory with corrected physical size metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -L "$V3_INDEX" -o "$RUNNER_TEMP/index.html"
          export OUT="$RUNNER_TEMP/inventory_corrected.json"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          from urllib.parse import urljoin
          raw=(Path(os.environ['RUNNER_TEMP'])/'index.html').read_bytes(); html=raw.decode('utf-8','replace')
          hrefs=re.findall(r'href=["\']([^"\']+\.txt)["\']',html,re.I)
          base='https://m-selig.ae.illinois.edu/props/volume-3/'
          dyn=re.compile(r'^(?P<prefix>.+)_(?P<rpm>\d{3,5})\.txt$',re.I)
          dim=re.compile(r'_(?P<D>\d+(?:\.\d+)?)x(?P<P>\d+(?:\.\d+)?)(?:f)?(?:_|$)',re.I)
          entries=[]
          for href in hrefs:
              name=Path(href).name
              if 'static' in name.lower(): continue
              m=dyn.match(name)
              if not m: continue
              parts=m.group('prefix').split('_')
              if len(parts)<2: continue
              family='_'.join(parts[:-1]); dm=dim.search(family+'_')
              if not dm: continue
              D=float(dm.group('D')); P=float(dm.group('P'))
              # Confirmed from the official Volume-3 page after v0.17 failed:
              # ancf_125x6, ancf_125x75, ancf_125x9 are 12.5x6, 12.5x7.5, 12.5x9.
              if family.startswith('ancf_125x'):
                  D=12.5
                  if family=='ancf_125x75': P=7.5
              entries.append({'href':href,'url':urljoin(base,href),'filename':name,'family':family,'diameter_in':D,'pitch_in':P,'rpm':int(m.group('rpm')),'rank_hash':hashlib.sha256((href+'\0'+name).encode()).hexdigest()})
          by={}
          for r in entries: by.setdefault(r['family'],[]).append(r)
          families=[]
          for fam,rows in sorted(by.items()):
              seen=set();uniq=[]
              for r in sorted(rows,key=lambda x:(x['rpm'],x['url'])):
                  if r['url'] in seen: continue
                  seen.add(r['url']);uniq.append(r)
              if len(uniq)<4: continue
              families.append({'family':fam,'diameter_in':uniq[0]['diameter_in'],'pitch_in':uniq[0]['pitch_in'],'run_count':len(uniq),'runs':uniq,'family_rank_hash':hashlib.sha256(('family\0'+fam).encode()).hexdigest()})
          payload={'source_index':os.environ['V3_INDEX'],'postfailure_geometry_audit':True,'corrected_families':['ancf_125x6','ancf_125x75','ancf_125x9'],'family_count':len(families),'run_count':sum(f['run_count'] for f in families),'families':families}
          Path(os.environ['OUT']).write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          print('CORRECTED_METADATA',len(families),sum(f['run_count'] for f in families))
          PY
      - name: Retrieve already-consumed Volume-3 measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3data"
          export INV="$RUNNER_TEMP/inventory_corrected.json"
          python - <<'PY' > "$RUNNER_TEMP/download.tsv"
          import json,os
          for f in json.load(open(os.environ['INV']))['families']:
              for r in f['runs']: print(r['url']+'\t'+r['filename'])
          PY
          export DATADIR="$RUNNER_TEMP/v3data"
          cat "$RUNNER_TEMP/download.tsv" | xargs -P 16 -d '\n' -I{} bash -c '
            line="$1"; url="${line%%$'"'"'\t'"'"'*}"; name="${line#*$'"'"'\t'"'"'}";
            curl --fail --silent --show-error -L --retry 3 "$url" -o "$DATADIR/$name"; test -s "$DATADIR/$name"
          ' _ {}
          test "$(find "$RUNNER_TEMP/v3data" -type f | wc -l)" -eq 279
      - name: Run post-failure corrected-metadata audit
        shell: bash
        run: |
          set +e
          rm -rf causal-loom-v018-v017-geometry-audit
          python "$RUNNER_TEMP/v017.py" \
            --protocol .causal-loom-v017/V017_FROZEN_PROTOCOL.json \
            --inventory "$RUNNER_TEMP/inventory_corrected.json" \
            --data-dir "$RUNNER_TEMP/v3data" \
            --output-dir causal-loom-v018-v017-geometry-audit \
            > "$RUNNER_TEMP/audit.log" 2>&1
          status=$?
          set -e
          mkdir -p causal-loom-v018-v017-geometry-audit
          cp "$RUNNER_TEMP/audit.log" causal-loom-v018-v017-geometry-audit/postfailure_audit_stdout.log
          cp "$RUNNER_TEMP/inventory_corrected.json" causal-loom-v018-v017-geometry-audit/
          printf '%s\n' "$status" > causal-loom-v018-v017-geometry-audit/AUDIT_RUNNER_EXIT_STATUS.txt
          cat "$RUNNER_TEMP/audit.log"
          # Do not fail the workflow based on the reused v0.17 frozen gates: this is explicitly post-failure analysis.
      - uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v018-v017-geometry-postfailure-audit
          path: causal-loom-v018-v017-geometry-audit
          if-no-files-found: error
          retention-days: 90
