name: Causal Loom v0.15 frozen TU Delft external confirmation

on:
  push:
    branches:
      - causal-loom-v015-raw-coordinate-20260826
    paths:
      - '.causal-loom-v015/**'
      - '.github/workflows/causal-loom-v015-frozen-tudelft.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  EXTERNAL_COMMIT: 6db5cc19327f0d6c31a4e51783a442704007dbc3
  PROTOCOL_SHA256: 6d7d2bbb420999abcae9d78efcd1f563895f876bb971e4b26a1ef492bf8362ff
  DEVELOPMENT_SHA256: c2f7cd94353a79369fb80d933649efe0d09b3393888bd735a1e8cc61359a1529
  RUNNER_SHA256: d3114b86a30423247a588d2b0a34a19f91bfd76355cac52c27c96562e3a10031
  RUNNER_PAYLOAD_SHA256: bbaf6e16c4b59d64cffbd0776631ed3afd2cbd100e6289ce827080d53117aa26

jobs:
  frozen-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen experiment branch
        uses: actions/checkout@v4
        with:
          ref: causal-loom-v015-raw-coordinate-20260826

      - name: Verify frozen scientific files before external access
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .causal-loom-v015/V015_FROZEN_PROTOCOL.json | cut -d' ' -f1)" = "$PROTOCOL_SHA256"
          test "$(sha256sum .causal-loom-v015/V015_DEVELOPMENT_EVIDENCE.json | cut -d' ' -f1)" = "$DEVELOPMENT_SHA256"
          test "$(sha256sum .causal-loom-v015/run_v015_frozen.py.gz.b64 | cut -d' ' -f1)" = "$RUNNER_PAYLOAD_SHA256"
          base64 --decode .causal-loom-v015/run_v015_frozen.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/run_v015_frozen.py"
          test "$(sha256sum "$RUNNER_TEMP/run_v015_frozen.py" | cut -d' ' -f1)" = "$RUNNER_SHA256"
          python -m py_compile "$RUNNER_TEMP/run_v015_frozen.py"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic numerical dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1

      - name: Run frozen executable self-test before external access
        run: python "$RUNNER_TEMP/run_v015_frozen.py" --self-test

      - name: Retrieve exact frozen TU Delft physical datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tudelft"
          curl --fail --silent --show-error -L "https://raw.githubusercontent.com/tudelft/propeller_airspeed_sensor/$EXTERNAL_COMMIT/data/input/wt.mat" -o "$RUNNER_TEMP/tudelft/wt.mat"
          curl --fail --silent --show-error -L "https://raw.githubusercontent.com/tudelft/propeller_airspeed_sensor/$EXTERNAL_COMMIT/data/input/test.mat" -o "$RUNNER_TEMP/tudelft/test.mat"
          test "$(git hash-object "$RUNNER_TEMP/tudelft/wt.mat")" = "d706b64eed073c892d03e201c20f666714c4f5a3"
          test "$(git hash-object "$RUNNER_TEMP/tudelft/test.mat")" = "479d63305b5bf3b242aa310c54169e7c26876122"
          echo EXTERNAL_BLOBS_VERIFIED

      - name: Execute first and permanent v0.15 external evaluation
        id: scientific
        shell: bash
        run: |
          set +e
          rm -rf causal-loom-v015-frozen-output
          python "$RUNNER_TEMP/run_v015_frozen.py" \
            --protocol .causal-loom-v015/V015_FROZEN_PROTOCOL.json \
            --wt "$RUNNER_TEMP/tudelft/wt.mat" \
            --flight "$RUNNER_TEMP/tudelft/test.mat" \
            --output-dir causal-loom-v015-frozen-output \
            > "$RUNNER_TEMP/v015_stdout.log" 2>&1
          status=$?
          set -e
          mkdir -p causal-loom-v015-frozen-output
          cp "$RUNNER_TEMP/v015_stdout.log" causal-loom-v015-frozen-output/stdout.log
          cat "$RUNNER_TEMP/v015_stdout.log"
          echo "$status" > causal-loom-v015-frozen-output/EXECUTION_EXIT_STATUS.txt
          cp .causal-loom-v015/V015_FROZEN_PROTOCOL.json causal-loom-v015-frozen-output/
          cp .causal-loom-v015/V015_DEVELOPMENT_EVIDENCE.json causal-loom-v015-frozen-output/
          cp "$RUNNER_TEMP/run_v015_frozen.py" causal-loom-v015-frozen-output/
          printf 'python=' > causal-loom-v015-frozen-output/RUNTIME_ENVIRONMENT.txt
          python --version >> causal-loom-v015-frozen-output/RUNTIME_ENVIRONMENT.txt 2>&1
          python -c 'import numpy,scipy; print("numpy="+numpy.__version__); print("scipy="+scipy.__version__)' >> causal-loom-v015-frozen-output/RUNTIME_ENVIRONMENT.txt
          find causal-loom-v015-frozen-output -type f ! -name FILES_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > causal-loom-v015-frozen-output/FILES_SHA256SUMS.txt
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload immutable v0.15 frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v015-tudelft-frozen-evidence
          path: causal-loom-v015-frozen-output
          if-no-files-found: error
          retention-days: 90

      - name: Preserve frozen scientific verdict as workflow conclusion
        if: always()
        shell: bash
        run: |
          status='${{ steps.scientific.outputs.exit_status }}'
          test -n "$status"
          exit "$status"
