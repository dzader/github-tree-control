name: Causal Loom v0.12 frozen direct-readout data bridge

on:
  push:
    branches:
      - causal-loom-v012-data-bridge-20260824

permissions:
  contents: read

jobs:
  package-public-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen bridge branch
        uses: actions/checkout@v4

      - name: Install deterministic Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.1.3 pandas==2.2.3

      - name: Retrieve and verify frozen public inputs
        run: |
          python causal_loom_v012/build_frozen_input_artifact.py \
            --work-dir "$RUNNER_TEMP/causal-loom-v012-work" \
            --output-dir "$RUNNER_TEMP/causal-loom-v012-artifact"

      - name: Upload frozen input artifact
        uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v012-frozen-inputs
          path: ${{ runner.temp }}/causal-loom-v012-artifact
          if-no-files-found: error
          retention-days: 7
