name: Causal Loom v0.19 low-rank five-probe atlas development

on:
  push:
    branches:
      - causal-loom-v019-projective-atlas-enola-20260831
    paths:
      - '.causal-loom-v019/develop_lowrank_projective_atlas.py'
      - '.github/workflows/causal-loom-v019-lowrank-five-probe-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-loom-v019-projective-atlas-enola-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 scikit-learn==1.5.2
      - name: Reconstruct corrected consumed Volume-3 inventory
        shell: bash
        env:
          V3_INDEX: https://m-selig.ae.illinois.edu/props/volume-3/propDB-volume-3.html
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -L "$V3_INDEX" -o "$RUNNER_TEMP/index.html"
          export OUT="$RUNNER_TEMP/inventory.json"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urljoin
          html=(Path(os.environ['RUNNER_TEMP'])/'index.html').read_text(errors='replace');hrefs=re.findall(r'href=["\']([^"\']+\.txt)["\']',html,re.I);base='https://m-selig.ae.illinois.edu/props/volume-3/'
          dyn=re.compile(r'^(?P<prefix>.+)_(?P<rpm>\d{3,5})\.txt$',re.I);dim=re.compile(r'_(?P<D>\d+(?:\.\d+)?)x(?P<P>\d+(?:\.\d+)?)(?:f)?(?:_|$)',re.I);entries=[]
          for href in hrefs:
              name=Path(href).name
              if 'static' in name.lower():continue
              m=dyn.match(name)
              if not m:continue
              parts=m.group('prefix').split('_')
              if len(parts)<2:continue
              family='_'.join(parts[:-1]);dm=dim.search(family+'_')
              if not dm:continue
              D=float(dm.group('D'));P=float(dm.group('P'))
              if family.startswith('ancf_125x'):
                  D=12.5
                  if family=='ancf_125x75':P=7.5
              entries.append({'url':urljoin(base,href),'filename':name,'family':family,'diameter_in':D,'pitch_in':P,'rpm':int(m.group('rpm'))})
          by={}
          for x in entries:by.setdefault(x['family'],[]).append(x)
          families=[]
          for fam,rows in sorted(by.items()):
              seen=set();uniq=[]
              for x in sorted(rows,key=lambda q:(q['rpm'],q['url'])):
                  if x['url'] in seen:continue
                  seen.add(x['url']);uniq.append(x)
              if len(uniq)>=4:families.append({'family':fam,'diameter_in':uniq[0]['diameter_in'],'pitch_in':uniq[0]['pitch_in'],'run_count':len(uniq),'runs':uniq})
          payload={'source_index':os.environ['V3_INDEX'],'corrected_12p5_geometry':True,'family_count':len(families),'run_count':sum(f['run_count'] for f in families),'families':families};Path(os.environ['OUT']).write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          if len(families)!=40 or sum(f['run_count'] for f in families)!=279:raise RuntimeError('unexpected inventory')
          PY
      - name: Retrieve consumed measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3data";export INV="$RUNNER_TEMP/inventory.json" DATADIR="$RUNNER_TEMP/v3data"
          python - <<'PY' > "$RUNNER_TEMP/download.tsv"
          import json,os
          for f in json.load(open(os.environ['INV']))['families']:
              for r in f['runs']:print(r['url']+'\t'+r['filename'])
          PY
          cat "$RUNNER_TEMP/download.tsv" | xargs -P 16 -d '\n' -I{} bash -c '
            line="$1";url="${line%%$'"'"'\t'"'"'*}";name="${line#*$'"'"'\t'"'"'}";
            curl --fail --silent --show-error -L --retry 4 "$url" -o "$DATADIR/$name";test -s "$DATADIR/$name"
          ' _ {}
          test "$(find "$RUNNER_TEMP/v3data" -type f | wc -l)" -eq 279
      - name: Execute exact five-probe low-rank development
        id: evaluate
        shell: bash
        run: |
          set +e
          rm -rf causal-loom-v019-lowrank-development
          python .causal-loom-v019/develop_lowrank_projective_atlas.py \
            --shared-module .causal-loom-v019/develop_projective_transport_atlas.py \
            --inventory "$RUNNER_TEMP/inventory.json" \
            --data-dir "$RUNNER_TEMP/v3data" \
            --output-dir causal-loom-v019-lowrank-development \
            > "$RUNNER_TEMP/lowrank.log" 2>&1
          status=$?
          set -e
          mkdir -p causal-loom-v019-lowrank-development
          cp "$RUNNER_TEMP/lowrank.log" causal-loom-v019-lowrank-development/stdout.log
          cp "$RUNNER_TEMP/inventory.json" causal-loom-v019-lowrank-development/development_inventory.json
          cat "$RUNNER_TEMP/lowrank.log"
          echo "$status" > causal-loom-v019-lowrank-development/EXECUTION_EXIT_STATUS.txt
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-loom-v019-lowrank-five-probe-development
          path: causal-loom-v019-lowrank-development
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Preserve development gate as workflow conclusion
        run: exit '${{ steps.evaluate.outputs.exit_status }}'
